<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII-ART-WEB</title>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
        margin: 0;
        padding: 0;
    }

    /* Color palette */
    :root {
        --prussian-blue: #0b132b;
        --space-indigo: #1C2541;
        --dusk-blue: #3A506B;
        --tropical-teal: #5BC0BE;
        --aquamarine: #6FFFE9;
    }

    body {
        background-color: var(--prussian-blue);
    }

    .press-start-2p-regular {
        font-family: "Press Start 2P", system-ui;
        font-weight: 400;
        font-style: normal;
    }

    #container {
        width: 80%;
        height: 95vh;
        margin: 0 auto;
        border: 1px solid red;
    }

    .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        color: var(--aquamarine);
        font-size: 100px;
        text-shadow: 0 0 3px rgb(255, 255, 255);
        /* filter: drop-shadow(0 0 10px white); */
        z-index: 0;
        pointer-events: none;
    }

    .background-element-container {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .background-element-container span {
        position: absolute;
        opacity: 0.6;
        transform-origin: center;
    }

    .background-element-container span:nth-child(1) { top: 10%; left: 5%; transform: rotate(15deg); }
    .background-element-container span:nth-child(2) { top: 40%; left: 80%; transform: rotate(-25deg); }
    .background-element-container span:nth-child(3) { top: 75%; left: 15%; transform: rotate(45deg); }
    .background-element-container span:nth-child(4) { top: 20%; left: 45%; transform: rotate(-10deg); }
    .background-element-container span:nth-child(5) { top: 85%; left: 60%; transform: rotate(70deg); }
    .background-element-container span:nth-child(6) { top: 50%; left: 25%; transform: rotate(-60deg); }
    .background-element-container span:nth-child(7) { top: 15%; left: 85%; transform: rotate(30deg); }
    .background-element-container span:nth-child(8) { top: 65%; left: 85%; transform: rotate(-40deg); }
    .background-element-container span:nth-child(9) { top: 85%; left: 35%; transform: rotate(10deg); }
    .background-element-container span:nth-child(10) { top: 30%; left: 10%; transform: rotate(-80deg); }
    .background-element-container span:nth-child(11) { top: 40%; left: 50%; transform: rotate(-80deg); }
</style>
<body>
    <div class="background press-start-2p-regular">
        <div class="background-element-container">
            <span>!</span>
            <span>@</span>
            <span>#</span>
            <span>$</span>
            <span>%</span>
            <span>&</span>
            <span>*</span>
            <span>!</span>
            <span>@</span>
            <span>#</span>
            <span>$</span>
        </div>
    </div>
    <div id="container">
        <div class="main-card">

        </div>
    </div>
</body>
</html>
