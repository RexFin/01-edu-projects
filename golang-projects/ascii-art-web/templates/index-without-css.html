<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASCII Art Web</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        textarea { width: 100%; height: 150px; }
        pre { background: #eee; padding: 15px; border-radius: 5px; }
        .options { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>ASCII Art Generator</h1>
    <form action="/ascii-art" method="POST">
        <textarea name="text" required placeholder="Enter text...">{{.Text}}</textarea>
        <div class="options">
            <select name="banner">
                {{$selected := .SelectedBanner}}

                {{range .Banners}}
                    {{if eq . $selected}}
                    <option selected value="{{.}}">{{ . }}</option>
                    {{else}}
                    <option value="{{.}}">{{ . }}</option>
                    {{end}}
                {{end}}
            </select>
            <button type="submit">Generate</button>
        </div>
    </form>

    {{if .Result}}
    <pre>{{.Result}}</pre>
    {{end}}
</body>
</html>
